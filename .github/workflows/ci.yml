name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20 exercises the sqlite3-CLI fallback in the Cursor collector;
        # 22 and 24 exercise the built-in node:sqlite path.
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Two repos drift silently. This catches an interface change in heatmap-ui
  # before a user does, rather than when the next version is published.
  against-heatmap-main:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm install github:tb962/heatmap-ui
      - run: npm run typecheck
      - run: npm test
