/* ---------------------------------------------------------------------------
 * shadcn/ui design tokens (neutral base). Real shadcn components need Tailwind
 * and a bundler; this page is served as a static file, so the system is
 * reproduced here by hand — same tokens, same radii, same component anatomy.
 * ------------------------------------------------------------------------- */
:root {
  color-scheme: light dark;

  --background: oklch(1 0 0);
  --foreground: oklch(0.145 0 0);
  --card: oklch(1 0 0);
  --card-foreground: oklch(0.145 0 0);
  --primary: oklch(0.205 0 0);
  --primary-foreground: oklch(0.985 0 0);
  --secondary: oklch(0.97 0 0);
  --muted: oklch(0.97 0 0);
  --muted-foreground: oklch(0.556 0 0);
  --accent: oklch(0.97 0 0);
  --border: oklch(0.922 0 0);
  --input: oklch(0.922 0 0);
  --ring: oklch(0.708 0 0);
  --destructive: oklch(0.577 0.245 27.325);

  /* Hairline over artwork: pure black light, pure white dark. Never tinted. */
  --hairline: oklch(0 0 0 / 0.1);

  /* Depth is a shadow, structure is a border. */
  --shadow-xs: 0 1px 2px 0 oklch(0 0 0 / 0.05);
  --shadow-border:
    0 0 0 1px oklch(0 0 0 / 0.06),
    0 1px 2px -1px oklch(0 0 0 / 0.06),
    0 2px 4px 0 oklch(0 0 0 / 0.04);
  --shadow-border-hover:
    0 0 0 1px oklch(0 0 0 / 0.08),
    0 1px 2px -1px oklch(0 0 0 / 0.08),
    0 2px 4px 0 oklch(0 0 0 / 0.06);

  --radius: 0.625rem;          /* 10px */
  --radius-sm: calc(var(--radius) - 4px);   /* 6px  */
  --radius-md: calc(var(--radius) - 2px);   /* 8px  */
  --radius-lg: var(--radius);               /* 10px */
  --radius-xl: calc(var(--radius) + 4px);   /* 14px */

  /* The properties panel's own rails. One label column, one control height,
   * so every row in every section lines up on the same two edges. */
  --panel-w: 284px;
  --panel-pad: 10px;
  --panel-label: 64px;
  --ctl-h: 28px;

  --focus-ring: 0 0 0 3px color-mix(in oklch, var(--ring) 50%, transparent);
  --ease-emphasis: cubic-bezier(0.2, 0, 0, 1);
  --expo-out: linear(0 0%, .1684 2.66%, .3165 5.49%, .446 8.52%, .5581 11.78%, .6535 15.29%, .7341 19.11%, .8011 23.3%, .8557 27.93%, .8962 32.68%, .9283 38.01%, .9529 44.08%, .9711 51.14%, .9833 59.06%, .9915 68.74%, 1 100%);
}

/* Explicit choice wins in both directions; no attribute means follow the system. */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --background: oklch(0.145 0 0);
    --foreground: oklch(0.985 0 0);
    --card: oklch(0.205 0 0);
    --card-foreground: oklch(0.985 0 0);
    --primary: oklch(0.922 0 0);
    --primary-foreground: oklch(0.205 0 0);
    --secondary: oklch(0.269 0 0);
    --muted: oklch(0.269 0 0);
    --muted-foreground: oklch(0.708 0 0);
    --accent: oklch(0.269 0 0);
    --border: oklch(1 0 0 / 10%);
    --input: oklch(1 0 0 / 15%);
    --ring: oklch(0.556 0 0);
    --destructive: oklch(0.704 0.191 22.216);
    --hairline: oklch(1 0 0 / 0.1);
    --shadow-xs: 0 1px 2px 0 oklch(0 0 0 / 0.3);
    --shadow-border: 0 0 0 1px oklch(1 0 0 / 0.08);
    --shadow-border-hover: 0 0 0 1px oklch(1 0 0 / 0.13);
  }
}
:root[data-theme="light"] { color-scheme: light; }
:root[data-theme="dark"] {
  color-scheme: dark;
  --background: oklch(0.145 0 0);
  --foreground: oklch(0.985 0 0);
  --card: oklch(0.205 0 0);
  --card-foreground: oklch(0.985 0 0);
  --primary: oklch(0.922 0 0);
  --primary-foreground: oklch(0.205 0 0);
  --secondary: oklch(0.269 0 0);
  --muted: oklch(0.269 0 0);
  --muted-foreground: oklch(0.708 0 0);
  --accent: oklch(0.269 0 0);
  --border: oklch(1 0 0 / 10%);
  --input: oklch(1 0 0 / 15%);
  --ring: oklch(0.556 0 0);
  --destructive: oklch(0.704 0.191 22.216);
  --hairline: oklch(1 0 0 / 0.1);
  --shadow-xs: 0 1px 2px 0 oklch(0 0 0 / 0.3);
  --shadow-border: 0 0 0 1px oklch(1 0 0 / 0.08);
  --shadow-border-hover: 0 0 0 1px oklch(1 0 0 / 0.13);
}

/* The theme effect is the reference's circle-blur reveal from the top left.
 * The normal state update remains the fallback for browsers without View
 * Transitions. */
@media (prefers-reduced-motion: no-preference) {
  ::view-transition {
    pointer-events: none;
  }
  ::view-transition-group(root) {
    animation-timing-function: var(--expo-out);
  }
  ::view-transition-new(root) {
    -webkit-mask: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40"><defs><filter id="blur"><feGaussianBlur stdDeviation="2"/></filter></defs><circle cx="0" cy="0" r="18" fill="white" filter="url(%23blur)"/></svg>') left top / 0 auto no-repeat;
    mask: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40"><defs><filter id="blur"><feGaussianBlur stdDeviation="2"/></filter></defs><circle cx="0" cy="0" r="18" fill="white" filter="url(%23blur)"/></svg>') left top / 0 auto no-repeat;
    -webkit-mask-origin: content-box;
    mask-origin: content-box;
    -webkit-mask-clip: border-box;
    mask-clip: border-box;
    transform-origin: left top;
    animation: theme-transition-scale 400ms ease both;
  }
  ::view-transition-old(root) {
    transform-origin: left top;
    z-index: -1;
    animation: theme-transition-scale 400ms ease both;
  }
  @keyframes theme-transition-scale {
    to {
      -webkit-mask-size: 350vmax auto;
      mask-size: 350vmax auto;
    }
  }
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--background);
  color: var(--foreground);
  font-family: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

/* The library takes its label and tooltip colours from CSS vars, so the
 * component inherits the design system rather than fighting it. The doubled
 * class matches the specificity of the library's own theme rule
 * (.heatmap:not([data-heatmap-theme="light"])); this sheet loads later, so the
 * tie resolves here. */
.heatmap.heatmap {
  --heatmap-label: var(--muted-foreground);
  --heatmap-tooltip-bg: var(--primary);
  --heatmap-tooltip-text: var(--primary-foreground);
  --heatmap-tooltip-border: transparent;
  --heatmap-tooltip-shadow: 0 10px 30px -10px oklch(0 0 0 / 0.35);
}

/* --- Layout ------------------------------------------------------------- */
.playground-root { position: relative; min-height: 100vh; }
.theme-transition-scope { min-height: 100vh; background: var(--background); color: var(--foreground); }
.shell { display: grid; grid-template-columns: var(--panel-w) minmax(0, 1fr); min-height: 100vh; }
@media (max-width: 900px) { .shell { grid-template-columns: 1fr; } }

/* --- Properties panel ---------------------------------------------------
 * A Figma-style inspector: a fixed header, one scrolling column of sections,
 * and a footer that never scrolls away. Every row snaps to the same two rails
 * — a label column and a control column — so the eye reads one edge, not six.
 * ---------------------------------------------------------------------- */
.sidebar {
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;
  height: calc(100vh - 16px);
  margin: 8px;
  border-radius: var(--radius-xl);
  background: var(--card);
  box-shadow: var(--shadow-border);
  position: sticky;
  top: 8px;
  overflow: hidden;                   /* clip the sections to the panel radius */
}

.panel-head {
  display: flex; flex-direction: column; gap: 8px;
  padding: 10px var(--panel-pad);
  border-bottom: 1px solid var(--border);
}
.panel-head-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }

.panel-body {
  overflow: auto;
  overscroll-behavior: contain;
  scrollbar-width: thin;
  scrollbar-color: color-mix(in oklch, var(--muted-foreground) 45%, transparent) transparent;
}
.panel-body::-webkit-scrollbar { width: 8px; height: 8px; }
.panel-body::-webkit-scrollbar-track { background: transparent; }
.panel-body::-webkit-scrollbar-thumb {
  background: color-mix(in oklch, var(--muted-foreground) 45%, transparent);
  border: 2px solid transparent;
  border-radius: 9999px;
  background-clip: padding-box;
  transition: background-color 150ms ease-out;
}
.panel-body::-webkit-scrollbar-thumb:hover { background: var(--muted-foreground); background-clip: padding-box; }
.panel-body::-webkit-scrollbar-corner { background: transparent; }

.panel-foot {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 7px 7px 7px var(--panel-pad);
  border-top: 1px solid var(--border);
  background: var(--card);
}
.panel-foot .btn { height: 26px; padding-inline: 8px 10px; border-radius: var(--radius-sm); font-size: 11.5px; }

/* --- Section ------------------------------------------------------------ */
.psec { border-bottom: 1px solid color-mix(in oklch, var(--foreground) 7%, transparent); }
.psec:last-child { border-bottom: 0; }
/* The entrance animation leaves each section as its own stacking context.
 * Raise the focused one so its menu can clear the sections below it. */
.psec:focus-within { position: relative; z-index: 40; }
.psec:has(.option-tooltip:hover), .psec:has(.option-tooltip:focus-visible) { position: relative; z-index: 40; }

.psec-head { display: flex; align-items: center; gap: 2px; height: 32px; padding-inline: var(--panel-pad) 6px; }
.psec-toggle {
  display: flex; align-items: center; gap: 5px;
  flex: 1; min-width: 0; height: 26px;
  margin-inline-start: -5px;          /* optical: the caret hangs into the gutter */
  padding-inline: 5px 4px;
  border: 0; border-radius: var(--radius-sm);
  background: transparent; color: var(--foreground);
  font: inherit; font-size: 11.5px; font-weight: 600; letter-spacing: -0.005em;
  text-align: start; cursor: pointer;
}
.psec-toggle:focus-visible { outline: none; box-shadow: var(--focus-ring); }
.psec-caret {
  display: inline-flex; flex: none;
  color: var(--muted-foreground);
  transition-property: rotate, color;
  transition-duration: 200ms;
  transition-timing-function: var(--ease-emphasis);
}
.psec[data-open="false"] .psec-caret { rotate: -90deg; }
.psec-toggle:hover .psec-caret { color: var(--foreground); }
.psec-dot {
  width: 5px; height: 5px; flex: none;
  border-radius: 9999px;
  background: var(--foreground);
}
.psec-action {
  display: grid; place-items: center;
  width: 24px; height: 24px; flex: none;
  border: 0; border-radius: var(--radius-sm);
  background: transparent; color: var(--muted-foreground);
  cursor: pointer; opacity: 0;
  transition-property: opacity, background-color, color, scale;
  transition-duration: 150ms;
  transition-timing-function: ease-out;
}
.psec-head:hover .psec-action, .psec-action:focus-visible { opacity: 1; }
.psec-action:hover { background: var(--accent); color: var(--foreground); }
.psec-action:active { scale: 0.96; }
.psec-action:focus-visible { outline: none; box-shadow: var(--focus-ring); }

.psec-panel {
  display: grid;
  grid-template-rows: 0fr;
  transition-property: grid-template-rows;
  transition-duration: 200ms;
  transition-timing-function: var(--ease-emphasis);
}
.psec[data-open="true"] .psec-panel { grid-template-rows: 1fr; }
/* Clipping is what makes the collapse read as a collapse, but it would also
 * cut off a select menu. The zero-length animation drops the clip only once
 * the section has finished opening, and removing it on close restores it at
 * the first frame of the collapse. */
.psec-clip { overflow: hidden; }
.psec[data-open="true"] .psec-clip { animation: psec-unclip 0s 220ms forwards; }
@keyframes psec-unclip { to { overflow: visible; } }
.psec-rows { display: flex; flex-direction: column; gap: 4px; padding: 0 var(--panel-pad) 10px; }

/* --- Inspector row ------------------------------------------------------ */
.prow {
  display: grid;
  grid-template-columns: var(--panel-label) minmax(0, 1fr);
  align-items: center; gap: 8px;
  min-height: var(--ctl-h);
}
.prow-wide { display: flex; flex-direction: column; align-items: stretch; gap: 5px; }
.prow-label {
  font-size: 11px; font-weight: 500; line-height: 1.2;
  color: var(--muted-foreground);
  user-select: none;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
label.prow-label { cursor: pointer; }
.prow-ctl { display: flex; align-items: center; gap: 6px; min-width: 0; }
.prow-ctl > * { min-width: 0; }
.prow-split > * { flex: 1 1 0; }
.prow-end { justify-content: flex-end; }
.prow:has(> .prow-ctl > .switch) { grid-template-columns: minmax(0, 1fr) auto; }
.prow:has(> .prow-ctl > .switch) .prow-label { white-space: normal; }
/* A lone number field keeps the rail rather than stretching across the column. */
.prow-ctl:not(.prow-split) > .nfield { max-width: 96px; }

.panel-body .select-wrap { width: 100%; }
.panel-body .select { height: var(--ctl-h); padding: 0 24px 0 8px; border-radius: var(--radius-sm); font-size: 12px; }
.panel-body .select-chevron { right: 7px; }

/* --- Scrub field --------------------------------------------------------
 * Figma's number input: type an exact value, nudge it with the arrow keys, or
 * drag the grip sideways. A slider can only be dragged, and only as finely as
 * its track is wide — this is smaller on the page and more precise to set.
 * ---------------------------------------------------------------------- */
.nfield {
  display: inline-flex; align-items: center; gap: 1px;
  width: 100%; height: var(--ctl-h);
  padding-inline: 2px 7px;
  border: 1px solid var(--input);
  border-radius: var(--radius-sm);
  background: transparent;
  box-shadow: var(--shadow-xs);
  transition-property: border-color, box-shadow;
  transition-duration: 150ms;
  transition-timing-function: ease-out;
}
.nfield:hover { border-color: var(--ring); }
.nfield:focus-within, .nfield[data-scrub="true"] { border-color: var(--ring); box-shadow: var(--focus-ring); }
.nfield-grip {
  display: grid; place-items: center;
  width: 22px; height: 22px; flex: none;
  border-radius: 4px;
  color: var(--muted-foreground);
  cursor: ew-resize;
  touch-action: none;
  transition-property: color, background-color;
  transition-duration: 150ms;
  transition-timing-function: ease-out;
}
.nfield:hover .nfield-grip, .nfield[data-scrub="true"] .nfield-grip { color: var(--foreground); }
.nfield[data-scrub="true"] .nfield-grip { background: var(--accent); }
.nfield-input {
  width: 100%; min-width: 0; height: 100%;
  padding: 0; border: 0;
  background: transparent; color: var(--foreground);
  font: inherit; font-size: 12px;
  font-variant-numeric: tabular-nums;
}
.nfield-input:focus { outline: none; }
.nfield-unit { flex: none; font-size: 11px; color: var(--muted-foreground); user-select: none; }
body[data-scrubbing="true"] { cursor: ew-resize; user-select: none; }

/* --- Tile group ---------------------------------------------------------
 * Sixteen bordered tiles draw sixteen boxes when only one of them matters.
 * The trough carries the structure; the selected tile lifts out of it, the
 * same way the theme tabs already work.
 * ---------------------------------------------------------------------- */
.tilebox {
  display: grid; gap: 3px;
  padding: 3px;                       /* concentric: 8 = 5 + 3 */
  border-radius: var(--radius-md);
  background: color-mix(in oklch, var(--foreground) 6%, transparent);
}
.tilebox-shape { grid-template-columns: repeat(8, minmax(0, 1fr)); }
.tilebox-ramp {
  display: flex; flex-wrap: wrap; align-items: center;
  gap: 2px; padding: 4px 5px;
}
.tile {
  display: grid; place-items: center;
  min-width: 0; height: 26px;
  padding: 0; border: 0; border-radius: 5px;
  background: transparent; color: var(--muted-foreground);
  cursor: pointer;
  transition-property: background-color, color, box-shadow, scale;
  transition-duration: 150ms;
  transition-timing-function: ease-out;
}
.tile:hover { background: color-mix(in oklch, var(--foreground) 12%, transparent); color: var(--foreground); }
.tile[aria-pressed="true"] {
  background: var(--background); color: var(--foreground);
  box-shadow: var(--shadow-xs), 0 0 0 1px var(--border);
}
.tile:active { scale: 0.96; }
.tile:focus-visible { outline: none; box-shadow: var(--focus-ring); }
.tile .shape-option-preview { width: 16px; height: 16px; }
.tile .shape-option-preview-cell { width: 13px; height: 13px; }
.tile-ramp {
  position: relative;
  width: 26px; height: 26px; flex: 0 0 26px;
  padding: 0;
  border-radius: 9999px;
}
.tile-ramp .ramp-option-preview {
  width: 22px; height: 22px; gap: 0;
  border-radius: 9999px; overflow: hidden;
  outline: 1px solid var(--hairline); outline-offset: -1px;
  background: linear-gradient(135deg, var(--ramp-start) 0 48%, var(--ramp-end) 52% 100%);
}
.tile-ramp .ramp-option-preview span { display: none; }
.tile-ramp[aria-pressed="true"] {
  background: var(--foreground);
  box-shadow: none;
}
.tile-ramp[aria-pressed="true"] .ramp-option-preview {
  outline-color: var(--background);
  outline-offset: -1px;
}
.tile-ramp[aria-pressed="true"]:focus-visible { box-shadow: var(--focus-ring); }
.custom-ramp-option-preview {
  display: inline-flex; align-items: center; justify-content: center;
  width: 22px; height: 22px;
  border: 2px dotted var(--muted-foreground);
  border-radius: 9999px;
}
.custom-ramp-option-dot {
  width: 7px; height: 7px;
  border-radius: 9999px;
  outline: 1px solid var(--hairline); outline-offset: -1px;
}
.tile-ramp:hover .custom-ramp-option-preview,
.tile-ramp[aria-pressed="true"] .custom-ramp-option-preview { border-color: var(--foreground); }
.option-tooltip { position: relative; }
.option-tooltip[data-tooltip]::before,
.option-tooltip[data-tooltip]::after {
  position: absolute; z-index: 50;
  pointer-events: none;
  opacity: 0;
  transition-property: opacity, scale;
  transition-duration: 150ms;
  transition-timing-function: var(--ease-emphasis);
}
.option-tooltip[data-tooltip]::after {
  content: attr(data-tooltip);
  left: 50%; bottom: calc(100% + 7px);
  padding: 4px 6px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--card); color: var(--foreground);
  box-shadow: var(--shadow-border);
  font-size: 10px; font-weight: 500; line-height: 1.1;
  width: max-content; max-width: 180px;
  text-align: center; white-space: normal;
  translate: -50% 3px; scale: .96;
}
.option-tooltip[data-tooltip]::before {
  content: "";
  left: 50%; bottom: calc(100% + 3px);
  width: 8px; height: 8px;
  border-right: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  border-radius: 1px;
  background: var(--card);
  rotate: 45deg;
  translate: -50% 50%;
  scale: .96;
}
.option-tooltip[data-tooltip]:hover::before,
.option-tooltip[data-tooltip]:focus-visible::before { opacity: 1; scale: 1; }
.option-tooltip[data-tooltip]:hover::after,
.option-tooltip[data-tooltip]:focus-visible::after {
  opacity: 1; translate: -50% 0; scale: 1;
}

/* Keep edge tooltips inside the inspector instead of centering them beyond
 * the panel rail. Palette rows are eight swatches wide at this density. */
.cell-segmented > .option-tooltip:first-child[data-tooltip]::after,
.dimension-switch > .option-tooltip:first-child[data-tooltip]::after,
.tabs-compact > .option-tooltip:first-child[data-tooltip]::after,
.tilebox-shape > .option-tooltip:nth-child(8n + 1)[data-tooltip]::after,
.tilebox-ramp > .option-tooltip:nth-child(8n + 1)[data-tooltip]::after {
  left: 0; translate: 0 3px;
}
.cell-segmented > .option-tooltip:first-child[data-tooltip]:hover::after,
.cell-segmented > .option-tooltip:first-child[data-tooltip]:focus-visible::after,
.dimension-switch > .option-tooltip:first-child[data-tooltip]:hover::after,
.dimension-switch > .option-tooltip:first-child[data-tooltip]:focus-visible::after,
.tabs-compact > .option-tooltip:first-child[data-tooltip]:hover::after,
.tabs-compact > .option-tooltip:first-child[data-tooltip]:focus-visible::after,
.tilebox-shape > .option-tooltip:nth-child(8n + 1)[data-tooltip]:hover::after,
.tilebox-shape > .option-tooltip:nth-child(8n + 1)[data-tooltip]:focus-visible::after,
.tilebox-ramp > .option-tooltip:nth-child(8n + 1)[data-tooltip]:hover::after,
.tilebox-ramp > .option-tooltip:nth-child(8n + 1)[data-tooltip]:focus-visible::after {
  translate: 0 0;
}
.cell-segmented > .option-tooltip:last-child[data-tooltip]::after,
.dimension-switch > .option-tooltip:last-child[data-tooltip]::after,
.tabs-compact > .option-tooltip:last-child[data-tooltip]::after,
.tilebox-shape > .option-tooltip:nth-child(8n)[data-tooltip]::after,
.tilebox-shape > .option-tooltip:last-child[data-tooltip]::after,
.tilebox-ramp > .option-tooltip:nth-child(8n)[data-tooltip]::after,
.tilebox-ramp > .option-tooltip:last-child[data-tooltip]::after {
  left: auto; right: 0; translate: 0 3px;
}
.cell-segmented > .option-tooltip:last-child[data-tooltip]:hover::after,
.cell-segmented > .option-tooltip:last-child[data-tooltip]:focus-visible::after,
.dimension-switch > .option-tooltip:last-child[data-tooltip]:hover::after,
.dimension-switch > .option-tooltip:last-child[data-tooltip]:focus-visible::after,
.tabs-compact > .option-tooltip:last-child[data-tooltip]:hover::after,
.tabs-compact > .option-tooltip:last-child[data-tooltip]:focus-visible::after,
.tilebox-shape > .option-tooltip:nth-child(8n)[data-tooltip]:hover::after,
.tilebox-shape > .option-tooltip:nth-child(8n)[data-tooltip]:focus-visible::after,
.tilebox-shape > .option-tooltip:last-child[data-tooltip]:hover::after,
.tilebox-shape > .option-tooltip:last-child[data-tooltip]:focus-visible::after,
.tilebox-ramp > .option-tooltip:nth-child(8n)[data-tooltip]:hover::after,
.tilebox-ramp > .option-tooltip:nth-child(8n)[data-tooltip]:focus-visible::after,
.tilebox-ramp > .option-tooltip:last-child[data-tooltip]:hover::after,
.tilebox-ramp > .option-tooltip:last-child[data-tooltip]:focus-visible::after {
  translate: 0 0;
}

/* The 3D block styles join the same trough language. */
.panel-body .material-options {
  gap: 3px; padding: 3px;
  border-radius: var(--radius-md);
  background: color-mix(in oklch, var(--foreground) 6%, transparent);
}
.panel-body .material {
  min-height: 46px; padding: 3px 2px 4px;
  border: 0; border-radius: 5px;
  background: transparent; font-size: 10px;
}
.panel-body .material:hover { background: color-mix(in oklch, var(--foreground) 12%, transparent); color: var(--foreground); }
.panel-body .material[aria-pressed="true"] {
  background: var(--background); color: var(--foreground);
  box-shadow: var(--shadow-xs), 0 0 0 1px var(--border);
}
.panel-body .material svg { width: 26px; height: 26px; }

/* Segmented controls shrink to the row height, staying concentric. */
.panel-body .cell-segmented { height: var(--ctl-h); padding: 2px; border-radius: var(--radius-md); }
.panel-body .cell-segmented button { height: 24px; border-radius: 6px; font-size: 11px; }

.panel-body .hex-input { width: 100%; height: var(--ctl-h); border-radius: var(--radius-sm); font-size: 12px; }
.panel-body .field-note { padding-block: 2px; }

.stage {
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 20px;
  padding: 32px;
  min-width: 0;
}
.stage::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background: radial-gradient(
    56% 42% at 62% 0%,
    color-mix(in oklch, var(--foreground) 5%, transparent),
    transparent 70%
  );
}
.stage > * { position: relative; z-index: 1; }

/* --- Brand -------------------------------------------------------------- */
.brand { display: flex; align-items: center; gap: 8px; min-width: 0; }
.brand-mark {
  display: grid;
  place-items: center;
  width: 26px; height: 26px;
  flex: none;
  border-radius: var(--radius-md);
  background: var(--primary);
  color: var(--primary-foreground);
  box-shadow: var(--shadow-xs);
}
.brand-copy { display: flex; flex-direction: column; min-width: 0; line-height: 1.1; }
.brand-name { font-size: 13px; font-weight: 600; letter-spacing: -0.01em; }
.brand-version { margin-top: 3px; color: var(--muted-foreground); font-size: 10px; line-height: 1; }

/* --- Badge -------------------------------------------------------------- */
.badge {
  display: inline-flex; align-items: center;
  flex: none; white-space: nowrap;   /* a dimension must never wrap mid-value */
  height: 20px; padding: 0 8px;
  border: 1px solid var(--border);
  border-radius: 9999px;
  background: var(--muted);
  color: var(--muted-foreground);
  font-size: 11px; font-weight: 500;
  font-variant-numeric: tabular-nums;
}

/* --- Field rows (the camera tray) --------------------------------------- */

.field { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.field > label { font-size: 11px; font-weight: 500; color: var(--muted-foreground); cursor: pointer; user-select: none; }
.field-label { font-size: 11px; font-weight: 500; color: var(--muted-foreground); }
.field-control { display: flex; align-items: center; gap: 8px; min-width: 0; }
.field-value {
  min-width: 38px; text-align: right;
  font-size: 11px; color: var(--muted-foreground);
  font-variant-numeric: tabular-nums;
}

/* --- Tabs (theme) ------------------------------------------------------- */
.tabs {
  display: inline-flex;
  width: 100%;
  padding: 3px;                       /* concentric: 10 = 7 + 3 */
  gap: 2px;
  border-radius: var(--radius-lg);
  background: var(--muted);
}
.tab {
  flex: 1;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 30px;
  padding-inline: 8px 10px;           /* optical: leading icon side -2px */
  border: 0;
  border-radius: 7px;
  background: transparent;
  color: var(--muted-foreground);
  font: inherit; font-size: 13px; font-weight: 500;
  cursor: pointer;
  transition-property: background-color, color, box-shadow, scale;
  transition-duration: 150ms;
  transition-timing-function: ease-out;
}
.tab:hover { color: var(--foreground); }
.tab:active { scale: 0.96; }
.tab[data-state="active"] {
  background: var(--background);
  color: var(--foreground);
  box-shadow: var(--shadow-xs);
}
.tab:focus-visible { outline: none; box-shadow: var(--focus-ring); }
.tabs-compact {
  position: relative;
  width: 96px;
  min-width: 96px;
  height: 32px;
  margin-inline: auto;
  padding: 0;
  gap: 0;
  border: 0;
  border-radius: 9999px;
  background: var(--background);
  box-shadow: inset 0 0 0 1px var(--border);
  overflow: visible;
}
.tabs-compact .tab {
  position: relative;
  flex: none;
  width: 32px;
  min-width: 32px;
  height: 32px;
  padding: 0;
  gap: 0;
  border-radius: 9999px;
  background: transparent;
  color: var(--muted-foreground);
  transition-property: color;
  transition-duration: 150ms;
  transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
}
.tabs-compact .tab:hover { color: var(--foreground); }
.tabs-compact .tab:active { scale: 1; }
.tabs-compact .tab[data-state="active"] {
  background: transparent;
  color: var(--foreground);
  box-shadow: none;
}
.tabs-compact .tab > .tabs-compact-active {
  position: absolute;
  inset: 0;
  border: 1px solid var(--border);
  border-radius: 9999px;
  pointer-events: none;
}
.tabs-compact .tab svg { flex: none; width: 16px; height: 16px; }
/* In the panel header the switcher sits beside a 26px brand mark. */
.panel-head .tabs-compact { width: 90px; min-width: 90px; height: 28px; margin-inline: 0; }
.panel-head .tabs-compact .tab { width: 30px; min-width: 30px; height: 28px; }
.panel-head .tabs-compact .tab svg { width: 15px; height: 15px; }
.tabs-compact .tab:focus-visible { box-shadow: var(--focus-ring); }

/* --- Select ------------------------------------------------------------- */
.select-wrap { position: relative; display: flex; width: 158px; }
.select {
  display: inline-flex; align-items: center; justify-content: space-between;
  width: 100%; height: 32px;
  padding: 0 28px 0 10px;
  border: 1px solid var(--input);
  border-radius: var(--radius-md);
  background: transparent;
  color: var(--foreground);
  font: inherit; font-size: 12px;
  text-align: left;
  cursor: pointer;
  box-shadow: var(--shadow-xs);
  transition-property: border-color, box-shadow;
  transition-duration: 150ms;
  transition-timing-function: ease-out;
}
.select-value {
  display: inline-flex; align-items: center; gap: 7px;
  min-width: 0;
}
.select-value-label { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.select:hover { border-color: var(--ring); }
.select:focus-visible { outline: none; border-color: var(--ring); box-shadow: var(--focus-ring); }
.select[aria-expanded="true"] { border-color: var(--ring); box-shadow: var(--focus-ring); }
.select-chevron {
  display: inline-flex; align-items: center; justify-content: center;
  width: 15px; height: 15px; line-height: 0;
  position: absolute; right: 10px; top: 50%;
  translate: 0 -50%;
  pointer-events: none;
  color: var(--muted-foreground);
  transition-property: rotate;
  transition-duration: 150ms;
  transition-timing-function: ease-out;
}
.select-wrap[data-open="true"] .select-chevron { rotate: 180deg; }
.select-menu {
  position: absolute; top: calc(100% + 4px); left: 0; z-index: 30;
  display: flex; flex-direction: column; gap: 2px;
  width: 100%; max-height: 280px; overflow-y: auto;
  padding: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  background: var(--card);
  color: var(--foreground);
  box-shadow: 0 10px 30px -12px oklch(0 0 0 / 0.5);
}
.select-wrap[data-placement="top"] .select-menu {
  top: auto;
  bottom: calc(100% + 4px);
}
.select-option {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  width: 100%; min-height: 32px;
  padding: 6px 8px;
  border: 0;
  border-radius: var(--radius-sm);
  background: transparent;
  color: var(--foreground);
  font: inherit; font-size: 13px;
  text-align: left;
  cursor: pointer;
}
.select-option-content { display: inline-flex; align-items: center; gap: 8px; min-width: 0; }
.chart-option-preview {
  display: inline-flex; align-items: center; justify-content: center;
  width: 18px; height: 18px; flex: none;
  color: var(--muted-foreground);
}
.select-value .chart-option-preview { color: var(--foreground); }
.shape-option-preview {
  display: inline-flex; align-items: center; justify-content: center;
  width: 20px; height: 20px; flex: none;
  color: var(--muted-foreground);
}
.shape-option-preview-cell { display: block; width: 16px; height: 16px; }
.ramp-option-preview {
  display: inline-flex; align-items: center; gap: 3px;
  width: 45px; height: 20px; flex: none;
}
.ramp-option-preview span {
  width: 9px; height: 9px; flex: none;
  border-radius: 9999px;
  outline: 1px solid var(--hairline);
  outline-offset: -1px;
}
.select-option[data-selected="true"] .shape-option-preview { color: var(--foreground); }
.select-option:hover,
.select-option[data-highlighted="true"] { background: var(--accent); }
.select-option[data-selected="true"] { font-weight: 500; }
.select-option:focus-visible { outline: none; box-shadow: var(--focus-ring); }
.select-option-check { display: inline-flex; flex: none; color: var(--muted-foreground); }

/* --- Slider ------------------------------------------------------------- */
.slider {
  width: 132px; height: 16px;
  background: transparent;
  cursor: pointer;
  appearance: none;
}
.slider::-webkit-slider-runnable-track {
  height: 6px; border-radius: 9999px;
  background: linear-gradient(
    to right,
    var(--primary) 0 var(--pct, 50%),
    var(--muted) var(--pct, 50%) 100%
  );
}
.slider::-webkit-slider-thumb {
  appearance: none;
  width: 16px; height: 16px;
  margin-top: -5px;                   /* (6 - 16) / 2 */
  border: 1px solid var(--primary);
  border-radius: 9999px;
  background: var(--background);
  box-shadow: var(--shadow-xs);
  transition-property: box-shadow;
  transition-duration: 150ms;
  transition-timing-function: ease-out;
}
.slider::-moz-range-track { height: 6px; border-radius: 9999px; background: var(--muted); }
.slider::-moz-range-progress { height: 6px; border-radius: 9999px; background: var(--primary); }
.slider::-moz-range-thumb {
  width: 14px; height: 14px;
  border: 1px solid var(--primary);
  border-radius: 9999px;
  background: var(--background);
  box-shadow: var(--shadow-xs);
}
.slider:focus-visible { outline: none; }
.slider:focus-visible::-webkit-slider-thumb { box-shadow: var(--focus-ring); }
.slider:focus-visible::-moz-range-thumb { box-shadow: var(--focus-ring); }

/* --- Switch ------------------------------------------------------------- */
.switch {
  position: relative;
  width: 32px; height: 18px;
  flex: none;
  padding: 0;
  border: 0;
  border-radius: 9999px;
  background: var(--input);
  cursor: pointer;
  transition-property: background-color, box-shadow;
  transition-duration: 150ms;
  transition-timing-function: ease-out;
}
.switch[data-state="checked"] { background: var(--primary); }
.switch:focus-visible { outline: none; box-shadow: var(--focus-ring); }
.switch-thumb {
  position: absolute; top: 2px; left: 2px;
  width: 14px; height: 14px;
  border-radius: 9999px;
  background: var(--background);
  box-shadow: var(--shadow-xs);
  transition-property: translate;
  transition-duration: 150ms;
  transition-timing-function: ease-out;
}
.switch[data-state="checked"] .switch-thumb { translate: 14px 0; }

/* --- Colour swatch ------------------------------------------------------ */
.swatch {
  display: inline-flex;
  padding: 3px;                       /* concentric: 8 = 5 + 3 */
  border: 1px solid var(--input);
  border-radius: var(--radius-md);
  background: var(--background);
  box-shadow: var(--shadow-xs);
  cursor: pointer;
  transition-property: border-color, box-shadow;
  transition-duration: 150ms;
  transition-timing-function: ease-out;
}
.swatch:hover { border-color: var(--ring); }
.swatch:focus-within { border-color: var(--ring); box-shadow: var(--focus-ring); }
.swatch input {
  width: 28px; height: 20px;
  padding: 0; border: 0;
  background: none;
  cursor: pointer;
  appearance: none;
}
.swatch input::-webkit-color-swatch-wrapper { padding: 0; }
.swatch input::-webkit-color-swatch {
  border: 0; border-radius: 5px;
  outline: 1px solid var(--hairline);
  outline-offset: -1px;
}
.swatch input::-moz-color-swatch { border: 0; border-radius: 5px; }

/* --- Hex field ---------------------------------------------------------- */
.hex { display: flex; align-items: center; gap: 6px; }
.hex-input {
  width: 96px; height: 32px;
  padding: 0 10px;
  border: 1px solid var(--input);
  border-radius: var(--radius-md);
  background: transparent;
  color: var(--foreground);
  font-family: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 12.5px;
  box-shadow: var(--shadow-xs);
  transition-property: border-color, box-shadow;
  transition-duration: 150ms;
  transition-timing-function: ease-out;
}
.hex-input:hover { border-color: var(--ring); }
.hex-input:focus-visible { outline: none; border-color: var(--ring); box-shadow: var(--focus-ring); }
.hex-input[aria-invalid="true"] { border-color: var(--destructive); }
.hex-input[aria-invalid="true"]:focus-visible {
  box-shadow: 0 0 0 3px color-mix(in oklch, var(--destructive) 40%, transparent);
}

/* --- Button ------------------------------------------------------------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 32px;
  padding-inline: 10px 12px;          /* optical: leading icon side -2px */
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  background: var(--background);
  color: var(--foreground);
  font: inherit; font-size: 13px; font-weight: 500;
  cursor: pointer;
  box-shadow: var(--shadow-xs);
  transition-property: background-color, color, border-color, box-shadow, scale;
  transition-duration: 150ms;
  transition-timing-function: ease-out;
}
.btn:hover { background: var(--accent); }
.btn:active { scale: 0.96; }
.btn:focus-visible { outline: none; border-color: var(--ring); box-shadow: var(--focus-ring); }
.btn-ghost { border-color: transparent; background: transparent; box-shadow: none; color: var(--muted-foreground); }
.btn-ghost:hover { background: var(--accent); color: var(--foreground); }

/* --- Icon cross-fade ---------------------------------------------------- */
.icon-swap { position: relative; display: inline-flex; }
.icon-swap > span {
  display: inline-flex;
  transition-property: opacity, filter, scale;
  transition-duration: 300ms;
  transition-timing-function: var(--ease-emphasis);
}
.icon-swap > span.is-overlay { position: absolute; inset: 0; align-items: center; justify-content: center; }
.icon-swap > span[data-on="true"]  { scale: 1; opacity: 1; filter: blur(0px); }
.icon-swap > span[data-on="false"] { scale: 0.25; opacity: 0; filter: blur(4px); }

/* --- Card --------------------------------------------------------------- */
.card {
  display: flex; flex-direction: column; gap: 16px;
  padding: 20px;
  border-radius: var(--radius-xl);
  background: var(--card);
  color: var(--card-foreground);
  box-shadow: var(--shadow-border);
  transition-property: box-shadow;
  transition-duration: 150ms;
  transition-timing-function: ease-out;
}
.card:hover { box-shadow: var(--shadow-border-hover); }
.card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
.preview-card { gap: 0; padding: 0; overflow: hidden; }
.preview-tabs {
  display: flex; align-items: stretch; gap: 2px;
  min-height: 46px; padding-inline: 16px;
  background: var(--card);
}
.preview-tab {
  position: relative;
  display: inline-flex; align-items: center;
  height: 46px; padding-inline: 8px;
  border: 0; border-radius: var(--radius-sm);
  background: transparent; color: var(--muted-foreground);
  font: inherit; font-size: 13px; font-weight: 500;
  line-height: 1; cursor: pointer;
  transition-property: color, background-color;
  transition-duration: 150ms;
  transition-timing-function: ease-out;
}
.preview-tab:hover { color: var(--foreground); }
.preview-tab[aria-selected="true"] { color: var(--foreground); }
.preview-tab[aria-selected="true"]::after {
  content: "";
  position: absolute; inset-inline: 0; bottom: 0;
  height: 2px; border-radius: 9999px;
  background: var(--foreground);
}
.preview-tab:focus-visible { outline: none; box-shadow: var(--focus-ring); }
.preview-surface {
  display: flex; flex-direction: column; gap: 16px;
  margin: 0 4px 4px; padding: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  background: var(--background); color: var(--foreground);
  overflow: hidden;
}
.code-panel { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.code-panel-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
.code-panel-head .card-desc { max-width: 60ch; }
.code-panel .code { overflow: auto; }
.card-title-line { display: flex; align-items: center; gap: 8px; min-width: 0; }
.card-title { margin: 0; font-size: 14px; font-weight: 600; letter-spacing: -0.01em; }
.card-desc { margin: 4px 0 0; font-size: 13px; color: var(--muted-foreground); }
.card-body {
  overflow-x: auto;
  /* overflow-x:auto computes overflow-y to auto too, which would clip the
   * tooltip above the top row and the cell's 1.18 hover scale. The negative
   * margin buys that room back without adding visible space. */
  margin: -44px -6px -6px;
  padding: 44px 6px 6px;
}

/* --- Page header -------------------------------------------------------- */
.page-title { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -0.02em; }
.page-desc { margin: 6px 0 0; font-size: 14px; color: var(--muted-foreground); max-width: 60ch; }
.install {
  display: inline-flex; align-items: center; gap: 4px;
  margin-top: 14px;
  padding: 4px;                       /* concentric: 10 = 6 + 4 */
  border-radius: var(--radius-lg);
  background: var(--muted);
}
.install code {
  padding: 0 8px;
  font-family: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 12.5px;
  color: var(--foreground);
}
.install .btn { height: 26px; border-radius: var(--radius-sm); }

/* --- Code block --------------------------------------------------------- */
.code {
  margin: 0;
  padding: 16px;
  border-radius: var(--radius-lg);
  background: var(--muted);
  color: var(--foreground);
  font-family: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 12.5px; line-height: 1.7;
  white-space: pre;
  overflow-x: auto;
}

/* --- Staged entrance ---------------------------------------------------- */
.enter {
  opacity: 0;
  transform: translateY(12px);
  filter: blur(4px);
  animation: enter 400ms ease-out forwards;
}
/* The index is passed in, because nth-child would also count the separators
 * between groups and break the even 100ms cadence. */
.enter { animation-delay: calc(var(--enter-index, 0) * 100ms); }
@keyframes enter {
  to { opacity: 1; transform: translateY(0); filter: blur(0); }
}

.boot { padding: 32px; color: var(--muted-foreground); }

/* The 3D workbench shares the playground's quiet, neutral chrome. */
.page-heading { display:flex; align-items:center; justify-content:space-between; gap:24px; }
.dimension-switch { display:flex; flex:none; gap:2px; padding:3px; border-radius:10px; background:var(--muted); }
.dimension-switch button { display:flex; align-items:center; justify-content:center; gap:6px; min-width:0; height:30px; padding:0 10px; border:0; border-radius:7px; background:transparent; color:var(--muted-foreground); font:inherit; font-size:12px; font-weight:500; cursor:pointer; }
.dimension-switch button[aria-pressed="true"] { background:var(--card); color:var(--foreground); box-shadow:var(--shadow-border); }
.dimension-switch button:focus-visible, .material:focus-visible, .camera-preset:focus-visible { outline:2px solid var(--ring); outline-offset:3px; }
.three-card { padding-bottom:16px; overflow:hidden; }
.preview-card.three-card { padding: 0; }
.three-card .card-head { align-items:center; }
.three-card .card-body { overflow:visible; margin:0 -16px; padding:0; }
.three-card .heatmap3d { width:100%; }
.three-kicker { display:flex; align-items:center; gap:7px; margin-bottom:8px; font:500 10px "Geist Mono",monospace; color:var(--muted-foreground); letter-spacing:.09em; text-transform:uppercase; }
.three-kicker i { display:block; width:6px; height:6px; border-radius:50%; background:var(--foreground); }
.material-options { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:5px; }
.material { display:flex; flex-direction:column; align-items:center; gap:1px; min-height:48px; padding:4px 2px 5px; border:1px solid var(--border); border-radius:8px; background:var(--card); color:var(--muted-foreground); font:inherit; font-size:10px; cursor:pointer; transition-property:background-color,color,border-color; transition-duration:150ms; transition-timing-function:ease-out; }
.material:hover { background:var(--muted); color:var(--foreground); }
.material[aria-pressed="true"] { color:var(--foreground); background:var(--muted); border-color:var(--foreground); }
.material svg { width:30px; height:30px; }
.field-note { margin:0; color:var(--muted-foreground); font-size:11px; line-height:1.6; }
.camera-presets { display:flex; flex-wrap:wrap; gap:5px; }
.camera-preset { flex:1; padding:7px 5px; border:1px solid var(--border); border-radius:7px; background:var(--card); color:var(--muted-foreground); font:inherit; font-size:11px; cursor:pointer; }
.camera-preset[aria-pressed="true"] { color:var(--foreground); background:var(--muted); border-color:var(--ring); }
.cell-segmented { display:flex; flex:1; min-width:0; padding:3px; gap:2px; border-radius:9999px; background:var(--muted); }

/**
 * A preset is a fixed ladder of stops, so a band count it was not written for
 * has to be read off the ladder rather than invented. Walking the existing
 * stops keeps each preset's character at any count, and returns the original
 * array untouched at its natural length.
 */
function resampleRamp(stops, levels) {
  if (levels === stops.length) return [...stops];
  if (levels <= 1) return [stops[stops.length - 1]];
  const rgb = stops.map(parseHex);
  return Array.from({ length: levels }, (_, index) => {
    const position = (index / (levels - 1)) * (stops.length - 1);
    const lower = Math.min(stops.length - 2, Math.floor(position));
    const weight = position - lower;
    const from = rgb[lower];
    const to = rgb[lower + 1];
    return toHex({
      r: from.r + (to.r - from.r) * weight,
      g: from.g + (to.g - from.g) * weight,
      b: from.b + (to.b - from.b) * weight,
    });
  });
}

 * for ten), or drag the grip sideways.
 */
function NumberField({ value, min, max, step = 1, suffix = "", label, id, onChange }) {
  const [draft, setDraft] = useState(null);
  const [scrubbing, setScrubbing] = useState(false);
  const drag = useRef(null);

  const clamp = (v) => Math.min(max, Math.max(min, Math.round(v / step) * step));
  const commit = (raw) => {
    const n = parseFloat(String(raw).replace(/[^0-9.+-]/g, ""));
    if (Number.isFinite(n)) onChange(clamp(n));
    setDraft(null);
  };
  const nudge = (dir, big) => { setDraft(null); onChange(clamp(value + dir * step * (big ? 10 : 1))); };

  const onPointerDown = (e) => {
    if (e.button !== 0) return;
    e.preventDefault();
    e.currentTarget.setPointerCapture(e.pointerId);
    drag.current = { x: e.clientX, from: value };
    setScrubbing(true);
    document.body.dataset.scrubbing = "true";
  };
  const onPointerMove = (e) => {
    if (!drag.current) return;
    const steps = Math.round((e.clientX - drag.current.x) / 4) * (e.shiftKey ? 10 : 1);
    onChange(clamp(drag.current.from + steps * step));
  };
  const onPointerUp = (e) => {
    if (!drag.current) return;
    drag.current = null;
    setScrubbing(false);
    delete document.body.dataset.scrubbing;
    if (e.currentTarget.hasPointerCapture?.(e.pointerId)) e.currentTarget.releasePointerCapture(e.pointerId);
  };

  const onKeyDown = (e) => {
    if (e.key === "Enter") { e.preventDefault(); commit(e.currentTarget.value); }
    else if (e.key === "Escape") { e.preventDefault(); setDraft(null); }
    else if (e.key === "ArrowUp") { e.preventDefault(); nudge(1, e.shiftKey); }
    else if (e.key === "ArrowDown") { e.preventDefault(); nudge(-1, e.shiftKey); }
  };

  return h("div", { className: "nfield", "data-scrub": scrubbing ? "true" : "false" },
    h("span", { className: "nfield-grip", "aria-hidden": "true", title: label + " — drag to change",
      onPointerDown, onPointerMove, onPointerUp, onPointerCancel: onPointerUp },
      h(Icon, { name: "scrub", size: 13, stroke: 1.5 })),
    h("input", { id, className: "nfield-input", type: "text", inputMode: "numeric",
      autoComplete: "off", spellCheck: false, "aria-label": label,
      value: draft ?? String(value),
      onChange: (e) => setDraft(e.target.value),
      onBlur: (e) => commit(e.target.value),
      onKeyDown }),
    suffix ? h("span", { className: "nfield-unit", "aria-hidden": "true" }, suffix) : null);
}

function NumRow({ s, set, name, label, min, max, step, suffix }) {
  const id = "c-" + name;

}

  return source === "github" && color === SOURCE_COLORS.github

function Tabs({ value, options, onChange, label, compact = false }) {
  const move = (event, index) => {
    if (!compact) return;
    const nextIndex = event.key === "Home" ? 0 : event.key === "End" ? options.length - 1 : null;
    const delta = event.key === "ArrowRight" || event.key === "ArrowDown" ? 1 :
      event.key === "ArrowLeft" || event.key === "ArrowUp" ? -1 : 0;
    if (nextIndex === null && !delta) return;
    event.preventDefault();
    const next = nextIndex === null ? (index + delta + options.length) % options.length : nextIndex;
    const group = event.currentTarget.parentElement;
    onChange(options[next].value, { animate: true });
    requestAnimationFrame(() => group?.children[next]?.focus());
  };
  return h("div", { className: "tabs" + (compact ? " tabs-compact" : ""),
    role: compact ? "radiogroup" : "tablist", "aria-label": label },
    options.map((option, index) => {
      const selected = value === option.value;
      return h("button", { key: option.value, type: "button",
        className: "tab" + (compact ? " option-tooltip" : ""), role: compact ? "radio" : "tab",
        "aria-selected": compact ? undefined : selected,
        "aria-checked": compact ? selected : undefined,
        tabIndex: compact ? (selected ? 0 : -1) : undefined,
        "data-state": selected ? "active" : "inactive",
        "aria-label": compact ? "Switch to " + option.label.toLowerCase() + " theme" : undefined,
        "data-tooltip": compact ? option.label + " theme" : undefined,
        // A pointer click animates; a programmatic one (detail 0) must not.
        onClick: (event) => { if (!selected) onChange(option.value, { animate: event.detail > 0 }); },
        onKeyDown: (event) => move(event, index) },
        h(Icon, { name: option.icon, size: compact ? 16 : 14, stroke: 2 }),
        compact && selected
          ? h("span", { className: "tabs-compact-active", "aria-hidden": "true" })
          : compact ? null : option.label);
    }));
}

/** Both icons stay mounted and cross-fade, so enter and exit both animate. */
function CopyButton({ text, label = "Copy", className = "btn" }) {
  const [copied, setCopied] = useState(false);
  const timer = useRef(null);
  useEffect(() => () => { if (timer.current) clearTimeout(timer.current); }, []);
  const copy = async () => {
    try { await navigator.clipboard.writeText(text); } catch { return; }
    setCopied(true);
    if (timer.current) clearTimeout(timer.current);
    timer.current = setTimeout(() => setCopied(false), 2000);
  };
  return h("button", { type: "button", className, onClick: copy,
    "aria-label": copied ? "Copied" : label },
    h("span", { className: "icon-swap" },
      h("span", { className: "is-overlay", "data-on": String(copied) }, h(Icon, { name: "check", stroke: 2 })),
      h("span", { "data-on": String(!copied) }, h(Icon, { name: "copy", stroke: 2 }))),
    copied ? "Copied" : label);

/* --- The username field ---------------------------------------------------
 * Submit-on-enter rather than search-as-you-type: the endpoint is someone
 * else's free service, and a keystroke is not a question worth asking it.

function UsernameField({ state, onSubmit, onClear }) {
  const [draft, setDraft] = useState("");
  const loading = state.status === "loading";

  const submit = (event) => {
    event?.preventDefault();

  };

  return h("form", { className: "userfield", onSubmit: submit,
    "data-state": state.status === "error" ? "error" : state.status },
    h("span", { className: "userfield-at", "aria-hidden": "true" }, "@"),
    h("input", { className: "userfield-input", type: "text", name: "github-username",
      placeholder: "github username", autoComplete: "off", spellCheck: false,
      "aria-label": "GitHub username to preview",
      value: draft, onChange: (event) => setDraft(event.target.value),
      // Implicit submission is gone while the spinner holds the button's
      // place, and this field is one the hands never leave.
      onKeyDown: (event) => { if (event.key === "Enter") submit(event); } }),
    // The clear button never replaces the submit one: a second name typed over
    // the first still has to have somewhere to go.
    state.status === "loaded"
      ? h("button", { type: "button", className: "userfield-clear",
          "aria-label": "Back to demo data",

          "aria-label": "Load this user's contributions" },
          h(Icon, { name: "arrow", size: 14, stroke: 2 })));
}

/* --- The snippet ----------------------------------------------------------
 * Only what differs from the defaults, so the code reads as a diff against
 * `<ActivityHeatmap data={activity} />` rather than as a wall of props.
 * ---------------------------------------------------------------------- */
function snippetFor(s, source, palette, username) {
  const props = [["data", "{activity}"]];
  const add = (name, value) => props.push([name, value]);
  const flag = (name, value) => add(name, "{" + value + "}");
  const is3d = s.dimension === "3d";

  if (source === "github") {
    flag("showAi", false);
  } else {
    flag("showGithub", false);
    if (source !== "all") add("defaultAiProvider", '"' + source + '"');
    flag("showProviderToggle", false);
  }

  if (s.weeks !== DEFAULTS.weeks) flag("weeks", s.weeks);
  if (s.weekStart !== DEFAULTS.weekStart) flag("weekStart", s.weekStart);
  if (s.theme !== DEFAULTS.theme) add("theme", '"' + s.theme + '"');
  if (s.card) add("card", "");

  if (is3d) {
    add("dimension", '"3d"');
    if (s.cellShape3d !== DEFAULTS.cellShape3d) add("cellShape3d", '"' + s.cellShape3d + '"');
    if (s.blockStyle !== DEFAULTS.blockStyle) add("blockStyle", '"' + s.blockStyle + '"');
    if (s.blockTheme !== DEFAULTS.blockTheme) add("blockTheme", '"' + s.blockTheme + '"');
    if (s.material !== DEFAULTS.material) add("material", '"' + s.material + '"');
    if (s.animation !== DEFAULTS.animation) add("animation", '"' + s.animation + '"');
    if (s.maxHeight !== DEFAULTS.maxHeight) flag("maxHeight", s.maxHeight);
    if (s.yaw !== DEFAULTS.yaw) flag("yaw", Math.round(s.yaw));
    if (s.pitch !== DEFAULTS.pitch) flag("pitch", Math.round(s.pitch));
    if (s.zoom !== DEFAULTS.zoom) flag("zoom", Math.round(s.zoom) / 100);
  } else {
    if (s.cellShape !== DEFAULTS.cellShape) add("cellShape", '"' + s.cellShape + '"');
    if (s.cellRadius !== DEFAULTS.cellRadius) flag("cellRadius", s.cellRadius);
    if (s.encode !== DEFAULTS.encode) add("encode", '"' + s.encode + '"');
  }
  if (s.cellSize !== DEFAULTS.cellSize) flag("cellSize", s.cellSize);
  if (s.cellGap !== DEFAULTS.cellGap) flag("cellGap", s.cellGap);

  if (s.scale !== DEFAULTS.scale) add("scale", '"' + s.scale + '"');
  if (s.levels !== DEFAULTS.levels) flag("levels", s.levels);
  if (palette.levelColors) {
    flag("levelColors", "[" + palette.levelColors.map((c) => '"' + c + '"').join(", ") + "]");
  } else if (palette.colors) {
    add("colors", "{{ " + source + ': "' + palette.colors[source] + '" }}');
  }
  if (s.emptyColor) add("emptyColor", '"' + s.emptyColor + '"');
  if (s.unknownOpacity !== DEFAULTS.unknownOpacity) flag("unknownOpacity", s.unknownOpacity / 100);

  for (const name of SECTIONS.labels) {
    if (s[name] !== DEFAULTS[name]) flag(name, s[name]);
  }

  const lines = props.map(([name, value]) => "  " + name + (value === "" ? "" : "=" + value));
  // Real data comes from the collector on your own machine, never from the
  // page's preview endpoint, so the snippet says how to generate it.
  const sync = username
    ? "// npx activity-heatmap sync --username " + username + "\n"
    : "";
  return sync
    + 'import activity from "./data/activity.json";\n'
    + 'import { ActivityHeatmap } from "@tb962/activity-heatmap";\n'
    + 'import "@thilakbhat/heatmap-ui/styles.css";\n'
    + 'import "@tb962/activity-heatmap/styles.css";\n\n'
    + "<ActivityHeatmap\n" + lines.join("\n") + "\n/>";
}

/* --- Theme ---------------------------------------------------------------- */

function useSystemDark() {
  const [dark, setDark] = useState(false);
  useEffect(() => {
    const query = window.matchMedia("(prefers-color-scheme: dark)");
    const sync = () => setDark(query.matches);
    sync();
    query.addEventListener("change", sync);
    return () => query.removeEventListener("change", sync);
  }, []);
  return dark;
}

/**
 * A theme flip repaints colour, background, border and shadow at once. Every
 * transition on those properties would fire together and smear the switch, so
 * they are suppressed for exactly one frame around the change.
 */
function suppressTransitions() {
  const style = document.createElement("style");
  style.append(document.createTextNode("*,*::before,*::after{transition:none !important}"));
  document.head.append(style);
  // Read for the side effect: forces the new colours to commit while the
  // override still applies, so no transition ever starts.
  void document.body.offsetHeight;
  requestAnimationFrame(() => requestAnimationFrame(() => style.remove()));
}

/* --- The page ------------------------------------------------------------- */

function App() {
  const [source, setSource] = useState("github");
  const [s, setState] = useState(DEFAULTS);
  const [colors, setColors] = useState(SOURCE_COLORS);
  const [openSections, setOpenSections] = useState({
    chart: true, cells: true, colour: true, camera: true, labels: false,
  });
  const [user, setUser] = useState({ status: "idle", name: "", data: null, error: null });
  const themeScopeRef = useRef(null);
  const activeThemeTransition = useRef(null);
  const request = useRef(null);
  const cache = useRef(new Map());

  const set = (name, value) => setState((prev) => ({ ...prev, [name]: value }));
  const toggleSection = (key) => setOpenSections((prev) => ({ ...prev, [key]: !prev[key] }));
  const is3d = s.dimension === "3d";
  const color = colors[source];
  const setColor = (value) => setColors((prev) => ({ ...prev, [source]: value }));

  const systemDark = useSystemDark();
  const themeAttr = s.theme === "system" ? undefined : s.theme;
  const isDark = themeAttr ? themeAttr === "dark" : systemDark;
  const ground = isDark ? GROUND_DARK : GROUND_LIGHT;

  // The theme choice has to reach the page chrome, not just the component.
  useEffect(() => {
    const element = document.documentElement;
    if (themeAttr) element.setAttribute("data-theme", themeAttr);
    else element.removeAttribute("data-theme");
  }, [themeAttr]);
  useEffect(() => { if (!themeAttr) suppressTransitions(); }, [systemDark, themeAttr]);

  /**
   * The circle-blur reveal from the top left. A pointer click animates; the
   * keyboard, reduced motion, and browsers without View Transitions fall back
   * to a plain state update.
   */
  const changeTheme = (theme, { animate = false } = {}) => {
    const switchTheme = () => set("theme", theme);
    const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const scope = themeScopeRef.current;
    const start = scope?.startViewTransition;
    if (!animate || reduced || !scope || typeof start !== "function") {
      suppressTransitions();
      switchTheme();
      return;
    }
    // A second flip mid-reveal would queue behind the first and lag the click.
    const active = activeThemeTransition.current;
    if (active) {
      active.skipTransition?.();
      activeThemeTransition.current = null;
      suppressTransitions();
      switchTheme();
      return;
    }
    try {
      const transition = start.call(scope, switchTheme);
      activeThemeTransition.current = transition;
      void transition.finished.catch(() => {}).finally(() => {
        if (activeThemeTransition.current === transition) activeThemeTransition.current = null;
      });
    } catch {
      suppressTransitions();
      switchTheme();
    }
  };

  /* --- Real GitHub data ------------------------------------------------- */
  const loadUser = useCallback(async (raw) => {
    const name = raw.trim().replace(/^@/, "");
    if (!USERNAME_PATTERN.test(name)) {
      setUser({ status: "error", name, data: null, error: "@" + name + " is not a GitHub username" });
      return;
    }
    const cached = cache.current.get(name.toLowerCase());
    if (cached) {
      setUser({ status: "loaded", name, data: cached, error: null });
      return;
    }
    request.current?.abort();
    const controller = new AbortController();
    request.current = controller;
    setUser({ status: "loading", name, data: null, error: null });
    try {
      const contributions = await fetchContributions(name, controller.signal);
      const dataset = datasetFor(name, contributions);
      cache.current.set(name.toLowerCase(), dataset);
      if (!controller.signal.aborted) setUser({ status: "loaded", name, data: dataset, error: null });
    } catch (error) {
      if (controller.signal.aborted) return;
      setUser({ status: "error", name, data: null, error: error.message });
    }
  }, []);
  const clearUser = useCallback(() => {
    request.current?.abort();
    setUser({ status: "idle", name: "", data: null, error: null });
  }, []);

  /* --- Palette ---------------------------------------------------------- */
  // Three of the 3D themes paint their own blocks, so the ramp steps aside.
  const themed3d = is3d && s.blockTheme !== "color";
  const palette = useMemo(() => {
    if (themed3d) return {};
    if (s.ramp !== SOURCE_RAMP) {
      return { levelColors: rampStops(s.ramp, { dark: isDark, levels: s.levels }) };
    }
    // The source's own colour is the component's default, so it is passed only
    // once it has been changed — that keeps GitHub's verbatim shades in play.
    return color === SOURCE_COLORS[source] ? {} : { colors: { [source]: color } };
  }, [themed3d, s.ramp, s.levels, isDark, color, source]);

  const isDefault = (name) =>
    name === "color" ? color === SOURCE_COLORS[source] : s[name] === DEFAULTS[name];
  const sectionModified = (key) => SECTIONS[key].some((name) => !isDefault(name));
  const resetSection = (key) => {
    setState((prev) => {
      const next = { ...prev };
      for (const name of SECTIONS[key]) if (name in DEFAULTS) next[name] = DEFAULTS[name];
      return next;
    });
    if (SECTIONS[key].includes("color")) setColor(SOURCE_COLORS[source]);
  };
  const changed = [...Object.keys(DEFAULTS), "color"].filter((name) => !isDefault(name)).length;
  const resetAll = () => {
    // Back to defaults means the theme too, and a theme flip with every
    // transition on the page still armed would smear the reset.
    if (s.theme !== DEFAULTS.theme) suppressTransitions();
    setState(DEFAULTS);
    setColors(SOURCE_COLORS);
  };

  const current = SOURCES.find((entry) => entry.value === source);
  const snippet = useMemo(
    () => snippetFor(s, source, palette, user.status === "loaded" ? user.name : ""),
    [s, source, palette, user.status, user.name]);

  // `key` remounts the card when the source changes: the provider a card opens
  // on is initial state inside the component, not a controlled prop.
  const graph = h(ActivityHeatmap, {
    key: source,
    data: user.data ?? undefined,
    theme: s.theme,
    weeks: s.weeks,
    weekStart: s.weekStart,
    showGithub: source === "github",
    showAi: source !== "github",
    defaultAiProvider: source === "github" ? "all" : source,
    showProviderToggle: false,
    card: s.card,
    showColumnLabels: s.showColumnLabels,
    showStats: s.showStats,
    showLegend: s.showLegend,
    showMonthLabels: s.showMonthLabels,
    showWeekdayLabels: s.showWeekdayLabels,
    dimension: s.dimension,
    cellShape: s.cellShape,
    cellSize: s.cellSize,
    cellGap: s.cellGap,
    cellRadius: s.cellRadius || undefined,
    encode: s.encode,
    cellShape3d: s.cellShape3d,
    blockStyle: s.blockStyle,
    blockTheme: s.blockTheme,
    material: s.material,
    animation: s.animation,
    maxHeight: s.maxHeight,
    yaw: s.yaw,
    pitch: s.pitch,
    zoom: s.zoom / 100,
    onCameraChange: (camera) => setState((prev) => ({
      ...prev, yaw: camera.yaw, pitch: camera.pitch, zoom: camera.zoom * 100,
    })),
    scale: s.scale,
    levels: s.levels,
    unknownOpacity: s.unknownOpacity / 100,
    emptyColor: s.emptyColor || undefined,
    ...palette,
  });

  const enter = (index) => ({ style: { "--enter-index": index } });
  const rampLabel = (name) => (name === SOURCE_RAMP ? "Default — " + current.label : RAMPS[name].label);

  return h("div", { className: "playground-root" },
    h("div", { className: "theme-transition-scope", ref: themeScopeRef },
      h("div", { className: "shell" },

        /* --- The inspector -------------------------------------------- */
        h("aside", { className: "sidebar enter", style: { "--enter-index": 0 } },
          h("div", { className: "panel-head" },
            h("div", { className: "panel-head-top" },
              h("div", { className: "brand" },
                h("span", { className: "brand-mark" }, h(BrandMark)),
                h("span", { className: "brand-copy" },
                  h("span", { className: "brand-name" }, "Activity Heatmap"),
                  h("span", { className: "brand-version" }, "one graph, your data"))),
              h(Tabs, {
                compact: true, label: "Theme", value: s.theme, onChange: changeTheme,
                options: [
                  { value: "light", label: "Light", icon: "sun" },
                  { value: "dark", label: "Dark", icon: "moon" },
                  { value: "system", label: "System", icon: "monitor" },
                ],
              })),
            h(DimensionSwitch, { value: s.dimension, onChange: (value) => set("dimension", value) })),

          h("div", { className: "panel-body" },
            h(Section, { ...enter(1), id: "sec-chart", title: "Chart",
              open: openSections.chart, onToggle: () => toggleSection("chart"),
              modified: sectionModified("chart"), onReset: () => resetSection("chart") },
              h(NumRow, { s, set, name: "weeks", label: "Weeks", min: 4, max: 53, step: 1, suffix: "w" }),
              h(PRow, { label: "Week starts" },
                h(Segmented, {
                  label: "Week starts", value: s.weekStart,
                  onChange: (value) => set("weekStart", value),
                  options: [{ value: 0, label: "Sun" }, { value: 1, label: "Mon" }],
                })),
              h(Switch, { s, set, name: "card", label: "Card container" })),

            h(Section, { ...enter(2), id: "sec-cells", title: is3d ? "Blocks" : "Cells",
              open: openSections.cells, onToggle: () => toggleSection("cells"),
              modified: sectionModified("cells"), onReset: () => resetSection("cells") },
              is3d ? [
                h(PBlock, { key: "style", label: "Block" },
                  h("div", { className: "material-options", role: "group", "aria-label": "Block style" },
                    BLOCK_STYLES.map((option) => h("button", { key: option.value, type: "button",
                      className: "material", title: option.label,
                      "aria-pressed": s.blockStyle === option.value,
                      onClick: () => set("blockStyle", option.value) },
                      h(BlockPreview, { kind: option.value }), option.label)))),
                h(PBlock, { key: "shape", label: "Shape" },
                  h(Segmented, {
                    label: "Block shape", value: s.cellShape3d,
                    onChange: (value) => set("cellShape3d", value),
                    options: SHAPES_3D.map((value) => ({ value, label: title(value) })),
                  })),
                h(NumRow, { key: "size", s, set, name: "cellSize", label: "Size", min: 6, max: 28, step: 1, suffix: "px" }),
                h(NumRow, { key: "gap", s, set, name: "cellGap", label: "Gap", min: 0, max: 12, step: 1, suffix: "px" }),
                h(NumRow, { key: "height", s, set, name: "maxHeight", label: "Height", min: 10, max: 150, step: 5 }),
                h(PRow, { key: "surface", label: "Surface" },
                  h(Segmented, {
                    label: "Surface", value: s.material, onChange: (value) => set("material", value),
                    options: [{ value: "solid", label: "Solid" }, { value: "pattern", label: "Pattern" }],
                  })),
                h(PRow, { key: "entrance", label: "Entrance" },
                  h(Segmented, {
                    label: "Entrance", value: s.animation, onChange: (value) => set("animation", value),
                    options: [{ value: "none", label: "None" }, { value: "grow", label: "Grow" }],
                  })),
              ] : [
                h(PBlock, { key: "shape", label: "Shape" },
                  h(TileGroup, {
                    label: "Shape", kind: "shape", options: SHAPES, value: s.cellShape,
                    onChange: (value) => set("cellShape", value), labelOf: title,
                    render: (shape) => h(ShapePreview, { shape }),
                  })),
                h(NumRow, { key: "size", s, set, name: "cellSize", label: "Size", min: 6, max: 28, step: 1, suffix: "px" }),
                h(NumRow, { key: "gap", s, set, name: "cellGap", label: "Gap", min: 0, max: 12, step: 1, suffix: "px" }),
                h(NumRow, { key: "radius", s, set, name: "cellRadius", label: "Radius", min: 0, max: 14, step: 1, suffix: "px" }),
                h(PRow, { key: "encode", label: "Encode" },
                  h(Segmented, {
                    label: "Encode", value: s.encode, onChange: (value) => set("encode", value),
                    options: ENCODINGS.map((value) => ({ value, label: value === "color" ? "Colour" : title(value) })),
                  })),
              ]),

            h(Section, { ...enter(3), id: "sec-colour", title: "Colour",
              open: openSections.colour, onToggle: () => toggleSection("colour"),
              modified: sectionModified("colour"), onReset: () => resetSection("colour") },
              is3d ? h(PBlock, { key: "blockTheme", label: "3D theme" },
                h(Segmented, {
                  label: "3D theme", value: s.blockTheme,
                  onChange: (value) => set("blockTheme", value),
                  options: THEMES_3D.map((value) => ({ value, label: title(value) })),
                })) : null,
              themed3d ? h("p", { key: "themed", className: "field-note" },
                title(s.blockTheme) + " picks its own colours. Switch to Color to paint the bands yourself.")
                : [
                  h(PBlock, { key: "palette", label: "Palette" },
                    h(TileGroup, {
                      label: "Palette", kind: "ramp", options: RAMP_NAMES, value: s.ramp,
                      onChange: (value) => set("ramp", value), labelOf: rampLabel,
                      render: (name) => h(RampPreview, {
                        stops: name === SOURCE_RAMP
                          ? sourceStops({ source, color, isDark, ground })
                          : rampStops(name, { dark: isDark, levels: 4 }),
                      }),
                    })),
                  s.ramp === SOURCE_RAMP
                    ? h(PRow, { key: "base", label: current.label },
                        h(HexField, { value: color, onChange: setColor, label: current.label + " colour" }))
                    : null,
                  h(PRow, { key: "empty", label: "Empty" },
                    h("span", { className: "swatch" },
                      h("input", { id: "c-empty", type: "color", "aria-label": "Empty day colour",
                        value: s.emptyColor || (isDark ? "#26231f" : "#ebedf0"),
                        onChange: (event) => set("emptyColor", event.target.value) }))),
                ],
              h(PBlock, { key: "shading", label: "Shading" },
                h(Segmented, {
                  label: "Shading", value: s.scale, onChange: (value) => set("scale", value),
                  options: SCALES.map((value) => ({ value, label: title(value) })),
                })),
              h(NumRow, { key: "bands", s, set, name: "levels", label: "Bands", min: 2, max: 8, step: 1 }),
              h(NumRow, { key: "nodata", s, set, name: "unknownOpacity", label: "No data", min: 0, max: 100, step: 5, suffix: "%" })),

            is3d ? h(Section, { ...enter(4), id: "sec-camera", title: "Camera",
              open: openSections.camera, onToggle: () => toggleSection("camera"),
              modified: sectionModified("camera"), onReset: () => resetSection("camera") },
              h(PBlock, { label: "Preset" },
                h("div", { className: "camera-presets", role: "group", "aria-label": "Camera presets" },
                  CAMERA_PRESETS.map((preset) => h("button", { key: preset.label, type: "button",
                    className: "camera-preset",
                    "aria-pressed": Math.abs(s.yaw - preset.yaw) < 1 && Math.abs(s.pitch - preset.pitch) < 1,
                    onClick: () => setState((prev) => ({ ...prev, ...preset, zoom: 100 })) },
                    preset.label)))),
              h(Slider, { s, set, name: "yaw", label: "Rotation", min: -180, max: 180, suffix: "°" }),
              h(Slider, { s, set, name: "pitch", label: "Tilt", min: 15, max: 75, suffix: "°" }),
              h(Slider, { s, set, name: "zoom", label: "Zoom", min: 55, max: 200, suffix: "%" }),
              h("p", { className: "field-note" },
                "Dragging the chart moves these directly, and the readout under the preview follows.")) : null,

            h(Section, { ...enter(5), id: "sec-labels", title: "Labels",
              open: openSections.labels, onToggle: () => toggleSection("labels"),
              modified: sectionModified("labels"), onReset: () => resetSection("labels") },
              h(Switch, { s, set, name: "showColumnLabels", label: "Title and source" }),
              h(Switch, { s, set, name: "showStats", label: "Totals row" }),
              h(Switch, { s, set, name: "showLegend", label: "Legend" }),
              h(Switch, { s, set, name: "showMonthLabels", label: "Month labels" }),
              h(Switch, { s, set, name: "showWeekdayLabels", label: "Weekday labels" }))),

          h("div", { className: "panel-foot" },
            h("span", { className: "rail-changes" },
              changed === 0 ? "Defaults" : changed + (changed === 1 ? " change" : " changes")),
            h("button", { type: "button", className: "btn btn-ghost", onClick: resetAll,
              disabled: changed === 0 },
              h(Icon, { name: "reset", size: 14, stroke: 2 }), "Reset all"))),

        /* --- The stage ------------------------------------------------- */
        h("main", { className: "stage" },
          h("header", { className: "page-heading enter", style: { "--enter-index": 1 } },
            h("div", null,
              h("h1", { className: "page-title" }, "Your activity, one graph at a time"),
              h("p", { className: "page-desc" },
                "GitHub contributions and local AI coding activity, each on its own calendar. ",
                "Put a username in and the GitHub graph becomes yours."),
              h("span", { className: "install" },
                h("code", null, "npm install @tb962/activity-heatmap"),
                h(CopyButton, { text: "npm install @tb962/activity-heatmap", label: "Copy", className: "btn btn-ghost" })))),

          h("section", { className: "card preview-card enter", style: { "--enter-index": 2 } },
            h("div", { className: "preview-tabs", role: "tablist", "aria-label": "Activity source" },
              SOURCES.map((entry) => h("button", {
                key: entry.value, type: "button", className: "preview-tab", role: "tab",
                "aria-selected": source === entry.value,
                onClick: () => setSource(entry.value),
              }, entry.label)),
              source === "github"
                ? h(UsernameField, { state: user, onSubmit: loadUser, onClear: clearUser })
                : null),
            h("div", { className: "preview-surface" },
              h("div", { className: "card-body" }, graph),
              h("div", { className: "chart-status" },
                h("span", null, h("strong", null, current.label), " · ", current.unit),
                is3d
                  ? h("span", null, "Drag to orbit · +/− to zoom · ",
                      h("strong", null, Math.round(s.yaw) + "°"), " / ", Math.round(s.pitch) + "°")
                  : h("span", null,
                      s.weeks + " weeks", " · ", s.scale + " shading", " · ", s.levels + " bands"))),
            h(GithubNote, { state: user, source })),

          h("section", { className: "card code-panel enter", style: { "--enter-index": 3 } },
            h("div", { className: "code-panel-head" },
              h("div", null,
                h("div", { className: "card-title-line" },
                  h("h2", { className: "card-title" }, "The props behind this graph")),
                h("p", { className: "card-desc" },
                  "Everything above is a prop. The shape, shading, band count, palette and ",
                  "3D scene are heatmap-ui controls, handed straight through.")),
              h(CopyButton, { text: snippet, label: "Copy" })),
            h("pre", { className: "code" }, snippet))))));
}

/** Where the numbers on screen came from, in one line, always. */
function GithubNote({ state, source }) {
  if (source !== "github") {
    return h("p", { className: "chart-note card-desc" },
      "Demo data. Real AI activity is collected on your own machine by ",
      h("code", null, "npx activity-heatmap sync"), ".");
  }
  if (state.status === "error") {
    return h("p", { className: "chart-note card-desc", "data-state": "error" }, state.error);
  }
  if (state.status === "loaded") {
    return h("p", { className: "chart-note card-desc" },
      "Public contributions for ",
      h("a", { href: "https://github.com/" + state.name, target: "_blank", rel: "noreferrer" },
        "@" + state.name),
      ", via ", h("code", null, CONTRIBUTIONS_HOST),
      ". The AI half stays demo data — only the collector on your machine can read that.");
  }
  return h("p", { className: "chart-note card-desc" },
    "Demo data. Put a GitHub username above to see your own contributions, fetched from the public ",
    h("code", null, CONTRIBUTIONS_HOST), " proxy.");
}

createRoot(document.getElementById("root")).render(h(App));
</script>
</body>
</html>
